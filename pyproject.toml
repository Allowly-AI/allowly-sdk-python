[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "allowly"
version = "0.8.0"
description = "Python SDK for the Allowly API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "allowly-receipt-format==5.0.0",
    # Reviewed pre-client source; keep the package version constraint above.
    "allowly-receipt-format @ https://github.com/Allowly-AI/allowly-receipt-format/archive/affb43af7cb7d4019e69437c4c5d66841694d4a2.tar.gz#subdirectory=verifiers/python",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/Allowly-AI/allowly-sdk-python"

[project.optional-dependencies]
fastmcp = [
    "fastmcp>=4.1.0,<5",
    "mcp>=2.3.0,<3",
]
dev = [
    "cryptography>=50.0.2",
    "fastmcp>=4.1.0,<5",
    "mcp>=2.3.0,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
prerelease = "disallow"

[tool.hatch.build.targets.wheel]
packages = ["allowly"]

[tool.hatch.metadata]
allow-direct-references = true
