[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "allowly"
version = "0.3.1"
description = "Python SDK for the Allowly API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/Allowly-AI/allowly-sdk-python"

[project.optional-dependencies]
fastmcp = [
    "fastmcp>=2.9,<3",
]
verifier = [
    "allowly-receipt-format>=4.0.1,<5.0.0",
]
dev = [
    "allowly-receipt-format>=4.0.1,<5.0.0",
    "cryptography>=42",
    "fastmcp>=2.9,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["allowly"]
